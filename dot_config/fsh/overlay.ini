[base]
; south's ANSI "black" slot is repurposed for a UI background tone (see
; ~/base16-kitty/colors/south.conf), so it can't be used for text -- "none"
; falls back to the terminal's real foreground color instead.
unknown-token = none,bold

[command-point]
alias             = blue
suffix-alias      = blue
builtin           = blue
function          = blue
command           = blue
precommand        = blue
hashed-command    = blue
single-sq-bracket = blue
double-sq-bracket = blue
