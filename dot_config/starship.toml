format = """$git_branch$git_status$directory$character"""

[character]
success_symbol = "[❯](bold fg:#0850b5)"
error_symbol = "[❯](bold fg:#787571)"
vimcmd_symbol = "[❯](bold fg:#323b45)"

[directory]
style = "bold fg:#323b45"
truncation_length = 1

[git_branch]
style = "bold fg:#615fb9"

[git_status]
style = "bold fg:#c1293d"
