# Show actual characters when hovering ligature
disable_ligatures cursor

shell /opt/homebrew/bin/fish

# background_opacity 0.8
# background_blur 30

map cmd+plus change_font_size current +4.0
map cmd+equal change_font_size current +4.0
map cmd+minus change_font_size current -4.0
map cmd+0 change_font_size current 0

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

map ctrl+l next_tab
map ctrl+h previous_tab

# kitty-navigator.nvim: forward CTRL-SHIFT-hjkl into a neighboring NeoVim
# split's panes when the focused window isn't running vim/nvim/fzf, otherwise
# pass the keys straight through so NeoVim handles the navigation itself.
# (Plain CTRL-h/l above are Kitty tab-switch keys, kept separate.)
map ctrl+shift+h kitten pass_keys.py neighboring_window left   ctrl+shift+h
map ctrl+shift+j kitten pass_keys.py neighboring_window bottom ctrl+shift+j
map ctrl+shift+k kitten pass_keys.py neighboring_window top    ctrl+shift+k
map ctrl+shift+l kitten pass_keys.py neighboring_window right  ctrl+shift+l

hide_window_decorations titlebar-only

window_padding_width 4

mouse_hide_wait -1

cursor_trail 1
cursor_text_color background

include font.conf
