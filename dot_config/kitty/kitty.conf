# Show actual characters when hovering ligature
disable_ligatures cursor

background_opacity 0.9
background_blur 50
background_image ~/.config/kitty/backgrounds/*
background_image_layout scaled

dynamic_background_opacity yes
map ctrl+minus set_background_opacity -0.1
map ctrl+equal set_background_opacity +0.1

# Cycle to the next image in backgrounds/ (glob'd by background_image above)
map ctrl+shift+b remote_control set-background-image +1

map cmd+plus change_font_size current +4.0
map cmd+equal change_font_size current +4.0
map cmd+minus change_font_size current -4.0
map cmd+0 change_font_size current 0

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

map cmd+enter set_tab_title

# cmd+w closes the tab immediately, no confirmation -- cmd+q (quit) still
# asks via confirm_os_window_close since it goes through the default action.
map cmd+w remote_control close-tab --self

allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

map ctrl+l next_tab
map ctrl+h previous_tab

map ctrl+shift+comma no_op
map ctrl+shift+period no_op
map ctrl+comma move_tab_backward
map ctrl+period move_tab_forward

# kitty-navigator.nvim: forward CTRL-SHIFT-hjkl into a neighboring NeoVim
# split's panes when the focused window isn't running vim/nvim/fzf, otherwise
# pass the keys straight through so NeoVim handles the navigation itself.
# (Plain CTRL-h/l above are Kitty tab-switch keys, kept separate.)
map ctrl+shift+h kitten pass_keys.py neighboring_window left   ctrl+shift+h
map ctrl+shift+j kitten pass_keys.py neighboring_window bottom ctrl+shift+j
map ctrl+shift+k kitten pass_keys.py neighboring_window top    ctrl+shift+k
map ctrl+shift+l kitten pass_keys.py neighboring_window right  ctrl+shift+l

enabled_layouts splits
map ctrl+enter launch --location=hsplit --cwd=current
map ctrl+shift+enter launch --location=vsplit --cwd=current

# kitty-scrollback.nvim: browse scrollback (or just the last command's
# output) in real NeoVim -- proper ANSI parsing, full-buffer scrolling, and
# Vim visual mode/yank straight to the system clipboard. No `map` triggers
# full scrollback directly -- zsh's "vv" binding (bindings.zsh) invokes it
# via `kitty @ action kitty_scrollback_nvim` instead. ctrl+shift+h (the
# plugin's suggested default) is already claimed by the nvim-navigator
# pass-through above, so last-command-output uses shift+cmd+v instead.
action_alias kitty_scrollback_nvim kitten '/Users/jon/.local/share/nvim/site/pack/core/opt/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py'
map shift+cmd+v kitty_scrollback_nvim --config ksb_builtin_last_cmd_output

hide_window_decorations titlebar-only

window_padding_width 4

mouse_hide_wait -1

cursor_trail 1
cursor_text_color background

# Startup default colors for brand-new windows -- kept in sync with the
# active Neovim colorscheme by the ColorScheme autocmd in init.lua, which
# copies base16-kitty/colors/<name>.conf onto this file on every change.
include current-theme.conf

include font.conf
